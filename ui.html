<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Serial Rename</title>
  <style>
    :root {
      --bg-primary: #1e1e1e;
      --bg-secondary: #2c2c2c;
      --bg-tertiary: #383838;
      --bg-accent: #0c8ce9;
      --bg-accent-hover: #1e96fc;
      --bg-success: #10a37f;
      --text-primary: #ffffff;
      --text-secondary: #b3b3b3;
      --text-muted: #757575;
      --border-color: #444444;
      --border-focus: #0c8ce9;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --font-main: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-main);
    }

    body {
      font-family: var(--font-main);
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-size: 12px;
      line-height: 1.5;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow: hidden;
      user-select: none;
      height: auto;
    }

    /* Container for scrollable content */
    .content-area {
      display: flex;
      flex-direction: column;
      padding-right: 2px;
    }

    /* Scrollbar Styling */
    .content-area::-webkit-scrollbar {
      width: 4px;
    }

    .content-area::-webkit-scrollbar-track {
      background: transparent;
    }

    .content-area::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: var(--radius-sm);
    }

    /* Typography */
    h2 {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-secondary);
      margin-bottom: 6px;
      font-weight: 700;
    }

    /* Section Wrapper */
    .section {
      margin-bottom: 14px;
    }



    /* Format Options */
    .format-chips {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }

    .format-chip {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 6px;
      text-align: center;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s ease;
      color: var(--text-secondary);
    }

    .format-chip:hover {
      border-color: var(--text-muted);
      color: var(--text-primary);
      background-color: var(--bg-tertiary);
    }

    .format-chip.active {
      border-color: var(--bg-accent);
      color: var(--text-primary);
      background-color: rgba(12, 140, 233, 0.1);
      box-shadow: 0 0 0 1px var(--bg-accent);
    }

    .format-chip-subtitle {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 1px;
      font-weight: normal;
    }

    /* Footer Button */
    .footer-actions {
      display: flex;
      flex-direction: column;
      margin-top: 4px;
    }

    .btn-primary {
      background: var(--bg-accent);
      border: none;
      color: var(--text-primary);
      font-family: var(--font-main);
      font-size: 12px;
      font-weight: 600;
      padding: 10px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--bg-accent-hover);
    }

    .btn-primary:active:not(:disabled) {
      background: var(--bg-accent);
    }

    .btn-primary:disabled {
      background: var(--bg-secondary);
      color: var(--text-muted);
      cursor: not-allowed;
      border: 1px solid var(--border-color);
    }

    /* Auto-detect Toggle */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 8px 10px;
    }

    .toggle-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-primary);
    }

    .toggle-sublabel {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 1px;
    }

    .switch {
      position: relative;
      width: 34px;
      height: 18px;
      flex-shrink: 0;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .switch-slider {
      position: absolute;
      inset: 0;
      background-color: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      border-radius: 9px;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .switch-slider::before {
      content: '';
      position: absolute;
      width: 12px;
      height: 12px;
      left: 2px;
      top: 50%;
      transform: translateY(-50%);
      background-color: var(--text-muted);
      border-radius: 50%;
      transition: all 0.25s ease;
    }

    .switch input:checked + .switch-slider {
      background-color: rgba(12, 140, 233, 0.3);
      border-color: var(--bg-accent);
    }

    .switch input:checked + .switch-slider::before {
      transform: translateY(-50%) translateX(16px);
      background-color: var(--bg-accent);
    }
  </style>
</head>

<body>

  <div class="content-area">
    <!-- Format Chooser -->
    <div class="section">
      <h2>Format Template</h2>
      <div class="format-chips">
        <div class="format-chip active" data-format="prefix-dot">
          <div>1. Name</div>
          <div class="format-chip-subtitle">Standard dot</div>
        </div>
        <div class="format-chip" data-format="prefix-padded">
          <div>01. Name</div>
          <div class="format-chip-subtitle">Padded double</div>
        </div>
        <div class="format-chip" data-format="prefix-bracket">
          <div>1) Name</div>
          <div class="format-chip-subtitle">Paren suffix</div>
        </div>
        <div class="format-chip" data-format="suffix-dash">
          <div>Name - 1</div>
          <div class="format-chip-subtitle">Appended dash</div>
        </div>
      </div>
    </div>

    <!-- Auto-detect Toggle -->
    <div class="section">
      <h2>Options</h2>
      <div class="toggle-row">
        <div>
          <div class="toggle-label">Auto Detect Order</div>
          <div class="toggle-sublabel">Number by position in row</div>
        </div>
        <label class="switch">
          <input type="checkbox" id="toggle-autodetect" checked>
          <span class="switch-slider"></span>
        </label>
      </div>
    </div>
  </div>

  <!-- Footer Actions -->
  <div class="footer-actions">
    <button class="btn-primary" id="btn-rename" disabled>
      <span>Rename Layers</span>
    </button>
  </div>

  <script>
    // Elements
    const btnRename = document.getElementById('btn-rename');
    const formatChips = document.querySelectorAll('.format-chip');

    // State Variables
    let currentSelection = [];
    let singleNodeSiblings = [];
    let selectedFormat = 'prefix-dot'; // Default format
    let autoDetect = true; // Default: auto-detection enabled

    // Elements
    const toggleAutodetect = document.getElementById('toggle-autodetect');

    // Initial load request
    parent.postMessage({ pluginMessage: { type: 'request-selection' } }, '*');

    // Listen for Format Chip Clicks
    formatChips.forEach(chip => {
      chip.addEventListener('click', () => {
        formatChips.forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        selectedFormat = chip.getAttribute('data-format');
        updateSelectionState();
      });
    });

    // Listen for Auto-detect Toggle
    toggleAutodetect.addEventListener('change', () => {
      autoDetect = toggleAutodetect.checked;
      updateSelectionState();
    });



    // Listen for Messages from Figma
    window.onmessage = (event) => {
      const msg = event.data.pluginMessage;
      if (msg && msg.type === 'selection') {
        currentSelection = msg.selection || [];
        singleNodeSiblings = msg.singleNodeSiblings || [];
        updateSelectionState();
      }
    };

    // Strip prefix or suffix
    function getCleanBaseName(name) {
      if (!name) return 'Layer';

      // Strips standard sequential prefixes at the start
      let clean = name.replace(/^\d+\s*[\.\)\s-]+\s*/, '');

      // Strips sequential suffixes at the end
      clean = clean.replace(/\s*[-_ ]+\s*\d+$/, '');

      clean = clean.trim();
      return clean || name;
    }

    // Format new name
    function formatName(baseName, index, formatType) {
      const numberStr = index.toString();
      const paddedNumberStr = index < 10 ? '0' + numberStr : numberStr;

      switch (formatType) {
        case 'prefix-dot':
          return `${numberStr}. ${baseName}`;
        case 'prefix-padded':
          return `${paddedNumberStr}. ${baseName}`;
        case 'prefix-bracket':
          return `${numberStr}) ${baseName}`;
        case 'suffix-dash':
          return `${baseName} - ${numberStr}`;
        default:
          return `${numberStr}. ${baseName}`;
      }
    }

    // Process sorting and enable renaming button
    function updateSelectionState() {
      let nodes = [...currentSelection];

      // Sort nodes by spatial position: top-to-bottom first, then left-to-right
      // This ensures serial numbers follow visual layout order regardless of Figma's selection order
      nodes.sort((a, b) => {
        const rowThreshold = Math.min(a.height || 0, b.height || 0) * 0.5;
        // If nodes are roughly on the same row (Y difference within half the smaller height), sort by X
        if (Math.abs(a.y - b.y) <= rowThreshold) {
          return a.x - b.x;
        }
        return a.y - b.y;
      });

      const count = nodes.length;

      if (count === 0) {
        btnRename.disabled = true;
        btnRename.innerHTML = `<span>Rename Layers</span>`;
        return;
      }

      btnRename.disabled = false;
      btnRename.innerHTML = `<span>Rename ${count} ${count === 1 ? 'Layer' : 'Layers'}</span>`;

      // Set up click handler to generate new names and send message
      btnRename.onclick = () => {
        const startNum = 1;
        const renames = [];

        for (let i = 0; i < nodes.length; i++) {
          const node = nodes[i];
          let sequenceIndex;

          if (autoDetect) {
            const nodeTop = node.y;
            const nodeBottom = node.y + (node.height || 0);

            // Filter siblings to same type, parent, AND same horizontal row (overlapping Y ranges)
            let siblingNodes = singleNodeSiblings.filter(s => {
              if (s.parentId !== node.parentId) return false;
              if (s.type !== node.type) return false;
              
              const sibTop = s.y;
              const sibBottom = s.y + (s.height || 0);
              return sibTop < nodeBottom && sibBottom > nodeTop;
            });

            // Sort siblings left to right by X coordinate
            siblingNodes.sort((a, b) => a.x - b.x);

            // Find the index of our selected node in the sorted siblings
            const index = siblingNodes.findIndex(s => s.id === node.id);
            sequenceIndex = startNum + (index !== -1 ? index : 0);
          } else {
            // No auto-detection: just number sequentially in selection order
            sequenceIndex = startNum + i;
          }

          const cleanBase = getCleanBaseName(node.name);
          const newName = formatName(cleanBase, sequenceIndex, selectedFormat);

          renames.push({
            id: node.id,
            newName: newName
          });
        }

        parent.postMessage({ pluginMessage: { type: 'rename', renames } }, '*');
      };
    }

    // Automatically observe and resize the Figma plugin window to fit the content exactly
    const resizeObserver = new ResizeObserver((entries) => {
      const height = document.documentElement.scrollHeight;
      parent.postMessage({ pluginMessage: { type: 'resize', height: height } }, '*');
    });
    resizeObserver.observe(document.documentElement);
  </script>
</body>

</html>
